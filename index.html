<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyAI">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>MyAI - 私人 AI 助手</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="打开会话列表">☰</button>
      <div class="brand"><span class="logo">✦</span><span>MyAI</span><small>私人 AI 助手</small></div>
      <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button>
    </header>

    <main class="main">
      <aside class="sidebar" id="sidebar">
        <button class="primary-btn full" id="newChatBtn">＋ 新建对话</button>
        <div class="side-title">最近对话</div>
        <div id="chatList" class="chat-list"></div>
        <div class="side-bottom">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">尚未配置 API</span>
        </div>
      </aside>

      <section class="chat-area">
        <div class="chat-head">
          <div>
            <div class="chat-title" id="chatTitle">新对话</div>
            <div class="chat-subtitle" id="modelSubtitle">请先在设置中配置接口</div>
          </div>
          <select id="modelSelect" class="model-select" aria-label="选择模型" disabled>
            <option>未配置</option>
          </select>
        </div>

        <div id="messages" class="messages">
          <div class="welcome" id="welcome">
            <div class="welcome-mark">✦</div>
            <h1>有什么可以帮你？</h1>
            <p>连接自己的 AI 中转站，开始私人对话。</p>
            <div class="suggestions">
              <button data-prompt="帮我制定一个清晰的工作计划">制定工作计划</button>
              <button data-prompt="请解释一个复杂概念，尽量通俗易懂">解释复杂概念</button>
              <button data-prompt="帮我分析这张图片中的内容">分析图片</button>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <div id="imagePreview" class="image-preview"></div>
          <div class="composer">
            <button id="attachBtn" class="attach-btn" title="添加图片">＋</button>
            <input id="imageInput" type="file" accept="image/*" multiple hidden>
            <textarea id="promptInput" rows="1" placeholder="给 MyAI 发送消息…"></textarea>
            <button id="sendBtn" class="send-btn" title="发送">↑</button>
          </div>
          <div class="composer-note">AI 生成内容可能有误。图片识别取决于所选模型及中转站支持情况。</div>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <section class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="panel-head"><h2>连接设置</h2><button class="icon-btn" id="closeSettings">✕</button></div>
    <div class="panel-body">
      <label>接口协议</label>
      <select id="protocol">
        <option value="openai">OpenAI 兼容接口</option>
        <option value="anthropic">Anthropic / Claude 接口</option>
      </select>

      <label>中转站 Base URL</label>
      <input id="baseUrl" type="url" placeholder="例如：https://api.example.com/v1" autocomplete="url">
      <p class="hint">填写接口基础地址。通常以 /v1 结尾，不要填写 API Key。</p>

      <label>API Key</label>
      <div class="key-row">
        <input id="apiKey" type="password" placeholder="粘贴你的 API Key" autocomplete="off">
        <button id="toggleKey" class="secondary-btn">显示</button>
      </div>

      <label>模型列表（每行一个模型 ID）</label>
      <textarea id="models" rows="4" placeholder="例如：&#10;gpt-4o&#10;gpt-4.1&#10;claude-sonnet-4-20250514"></textarea>
      <p class="hint">模型 ID 以你的中转站实际支持列表为准。两种协议的模型列表可能不同。</p>

      <label>默认模型</label>
      <input id="defaultModel" type="text" placeholder="例如：gpt-4o">

      <label>系统提示词（可选）</label>
      <textarea id="systemPrompt" rows="3" placeholder="例如：你是一个严谨、善于分析的中文助手。"></textarea>

      <div class="warning">
        <strong>安全提示</strong>
        <p>API Key 会保存在当前浏览器的本地存储中。不要在公用设备使用，也不要把部署地址和密钥一起公开分享。请确认中转站允许来自本网页域名的跨域请求（CORS）。</p>
      </div>
      <div class="panel-actions">
        <button id="saveSettings" class="primary-btn">保存设置</button>
        <button id="testConnection" class="secondary-btn">测试连接</button>
      </div>
      <div id="settingsMessage" class="settings-message"></div>
      <button id="clearLocal" class="danger-btn">清除本机设置和聊天记录</button>
    </div>
  </section>

  <script src="./app.js"></script>
</body>
</html>
